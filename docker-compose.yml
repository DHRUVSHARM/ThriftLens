x-backend-env: &backend-env
  PROVIDER_MODE: ${PROVIDER_MODE:-SAMPLE_MODE}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://thriftlens:thriftlens@postgres:5432/thriftlens}
  DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
  DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  GOOGLE_CLOUD_API_KEY: ${GOOGLE_CLOUD_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash}
  GEMINI_EXTRACTION_MODEL: ${GEMINI_EXTRACTION_MODEL:-gemini-3.1-flash-lite}
  GEMINI_EXTRACTION_FALLBACK_MODEL: ${GEMINI_EXTRACTION_FALLBACK_MODEL:-gemini-3.5-flash}
  GEMINI_EXTRACTION_QUALITY_MODEL: ${GEMINI_EXTRACTION_QUALITY_MODEL:-gemini-3.5-flash}
  GEMINI_TEXT_SAFETY_MODEL: ${GEMINI_TEXT_SAFETY_MODEL:-gemini-3.1-flash-lite}
  GEMINI_REPAIR_MODEL: ${GEMINI_REPAIR_MODEL:-gemini-3.1-flash-lite}
  GEMINI_RANKING_MODEL: ${GEMINI_RANKING_MODEL:-gemini-3.1-flash-lite}
  GEMINI_RANKING_ENABLED: ${GEMINI_RANKING_ENABLED:-false}
  SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
  SERPAPI_MCP_BASE_URL: ${SERPAPI_MCP_BASE_URL:-https://mcp.serpapi.com}
  SERPAPI_MAX_CALLS_PER_JOB: ${SERPAPI_MAX_CALLS_PER_JOB:-2}
  PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-20}
  PROVIDER_MAX_RETRIES: ${PROVIDER_MAX_RETRIES:-1}
  PROVIDER_BACKOFF_BASE_SECONDS: ${PROVIDER_BACKOFF_BASE_SECONDS:-2}
  PROVIDER_BACKOFF_MAX_SECONDS: ${PROVIDER_BACKOFF_MAX_SECONDS:-15}
  PROVIDER_JITTER_RATIO: ${PROVIDER_JITTER_RATIO:-0.25}
  CIRCUIT_BREAKER_FAILURE_THRESHOLD: ${CIRCUIT_BREAKER_FAILURE_THRESHOLD:-3}
  CIRCUIT_BREAKER_WINDOW_SECONDS: ${CIRCUIT_BREAKER_WINDOW_SECONDS:-120}
  CIRCUIT_BREAKER_COOLDOWN_SECONDS: ${CIRCUIT_BREAKER_COOLDOWN_SECONDS:-300}
  INPUT_GATE_MIN_PRODUCT_CONFIDENCE: ${INPUT_GATE_MIN_PRODUCT_CONFIDENCE:-0.65}
  INPUT_GATE_TARGET_MATCH_CONFIDENCE: ${INPUT_GATE_TARGET_MATCH_CONFIDENCE:-0.70}
  INPUT_GATE_QUALITY_MODEL_CONFIDENCE: ${INPUT_GATE_QUALITY_MODEL_CONFIDENCE:-0.82}
  INPUT_GATE_MAX_PRODUCTS_WITHOUT_TARGET: ${INPUT_GATE_MAX_PRODUCTS_WITHOUT_TARGET:-1}
  TEXT_SAFETY_MODEL_ENABLED: ${TEXT_SAFETY_MODEL_ENABLED:-false}
  TEXT_SAFETY_MODEL_SAFE_THRESHOLD: ${TEXT_SAFETY_MODEL_SAFE_THRESHOLD:-0.74}
  TEXT_SAFETY_MODEL_UNSAFE_THRESHOLD: ${TEXT_SAFETY_MODEL_UNSAFE_THRESHOLD:-0.68}
  PRODUCT_UNDERSTANDING_AGENT_ENABLED: ${PRODUCT_UNDERSTANDING_AGENT_ENABLED:-false}
  PRODUCT_UNDERSTANDING_MODEL: ${PRODUCT_UNDERSTANDING_MODEL:-}
  PRODUCT_UNDERSTANDING_MAX_TOOL_CALLS: ${PRODUCT_UNDERSTANDING_MAX_TOOL_CALLS:-3}
  EXTRACTION_MCP_URL: ${EXTRACTION_MCP_URL:-http://extraction-mcp:8001/mcp}
  DISCOVERY_MCP_URL: ${DISCOVERY_MCP_URL:-http://discovery-mcp:8002/mcp}
  DISCOVERY_MODEL: ${DISCOVERY_MODEL:-}
  DISCOVERY_MAX_ENGINES: ${DISCOVERY_MAX_ENGINES:-3}
  DISCOVERY_ENGINE_ALLOWLIST: ${DISCOVERY_ENGINE_ALLOWLIST:-google_shopping,google,bing_shopping,ebay,amazon,walmart,home_depot}
  RANKING_MCP_URL: ${RANKING_MCP_URL:-http://ranking-mcp:8003/mcp}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
  MINIO_BUCKET: ${MINIO_BUCKET:-thriftlens-uploads}
  OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
  OBJECT_STORAGE_SECURE: ${OBJECT_STORAGE_SECURE:-false}
  MAX_QUEUED_JOBS: ${MAX_QUEUED_JOBS:-50}
  MAX_ACTIVE_JOBS: ${MAX_ACTIVE_JOBS:-10}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-8}
  MAX_TEXT_LENGTH: ${MAX_TEXT_LENGTH:-2000}
  LIVE_PROVIDER_SMOKE: ${LIVE_PROVIDER_SMOKE:-false}

services:
  frontend:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started

  frontend-e2e:
    profiles:
      - test
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    environment:
      PLAYWRIGHT_BASE_URL: http://127.0.0.1:3100

  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      <<: *backend-env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    environment:
      <<: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      extraction-mcp:
        condition: service_started
      discovery-mcp:
        condition: service_started
      ranking-mcp:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  extraction-mcp:
    build:
      context: ./backend
    command: python -m app.mcp_servers.extraction.server
    environment:
      <<: *backend-env
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: 8001
      MCP_SERVER_PATH: /mcp
      MCP_SERVER_TRANSPORT: streamable-http
    volumes:
      - ./backend:/app
    depends_on:
      minio-init:
        condition: service_completed_successfully

  discovery-mcp:
    build:
      context: ./backend
    command: python -m app.mcp_servers.discovery.server
    environment:
      <<: *backend-env
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: 8002
      MCP_SERVER_PATH: /mcp
      MCP_SERVER_TRANSPORT: streamable-http
    volumes:
      - ./backend:/app

  ranking-mcp:
    build:
      context: ./backend
    command: python -m app.mcp_servers.ranking.server
    environment:
      <<: *backend-env
      MCP_SERVER_HOST: 0.0.0.0
      MCP_SERVER_PORT: 8003
      MCP_SERVER_PATH: /mcp
      MCP_SERVER_TRANSPORT: streamable-http
    volumes:
      - ./backend:/app

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-thriftlens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-thriftlens}
      POSTGRES_DB: ${POSTGRES_DB:-thriftlens}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-thriftlens-uploads}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY}; do sleep 1; done &&
      mc mb --ignore-existing local/$${MINIO_BUCKET}
      "

volumes:
  postgres_data:
  minio_data:
